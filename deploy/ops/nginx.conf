pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 gzip on;
 gzip_types application/wasm application/javascript text/css application/json;
 server {
  listen 8080;
  server_name finny.mango-kokos.ru;
  root /srv/site/current;
  index index.html;
  set_real_ip_from traefik-main;
  real_ip_header X-Real-IP;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
   resolver 127.0.0.11 valid=10s;
   set $backend http://api:8000;
   proxy_pass $backend;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 30s;
  }
  location / { add_header Cache-Control 'no-cache'; try_files $uri $uri/ =404; }
 }
}
